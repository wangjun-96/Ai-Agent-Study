# Alembic configuration file: database migration entry point.
# The connection string is NOT hardcoded here; it is injected by
# alembic/env.py from app/db/database.py (settings) to keep env vars unified.

[alembic]
# Migration script directory (relative to project root)
script_location = alembic

# Timestamped filename prefix for sorting migrations chronologically
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Connection string injected by env.py from settings (left empty here)
sqlalchemy.url =


# Logging configuration: separate alembic and sqlalchemy loggers
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
