[pytest]
# 测试文件发现规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试路径：tests 目录
testpaths = tests

# 输出详细，短回溯
addopts = -v --tb=short

# 过滤第三方库弃用警告（starlette/anyio 升级周期内的噪声，与本项目代码无关）：
# - starlette 1.6 建议 httpx→httpx2，过渡期 TestClient 仍可正常工作
# - anyio 4.x 内部别名迁移提示
filterwarnings =
    ignore::DeprecationWarning
    ignore::starlette.exceptions.StarletteDeprecationWarning
